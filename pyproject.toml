[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-lgbm-quant"
version = "0.1.0"
description = "A-share LightGBM quantitative research and backtesting system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ashare Quant Contributors" }]
dependencies = [
    "baostock>=0.8.9",
    "duckdb>=1.0",
    "efinance>=0.5.8",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "optuna>=3.6",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "tushare>=1.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: optional tests that may call external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["ashare_quant"]
