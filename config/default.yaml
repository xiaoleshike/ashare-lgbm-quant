environment: development
project_name: ashare-lgbm-quant
paths:
  raw_data: data/raw
  processed_data: data/processed
  parquet_store: data_on_sata/parquet
  duckdb_path: data/ashare_quant.duckdb
  reports: reports
  models: models
  backtests: backtests
  data_quality_logs: logs/data_quality
logging:
  level: INFO
  json_logs: true
data:
  provider: tushare
  # Temporarily disabled because the BaoStock service is currently unreliable.
  run_baostock_post_ingestion_check: false
  retry_attempts: 3
  rate_limit_per_minute: 500
  endpoint_rate_limits_per_minute:
    cyq_chips: 200
  request_interval_seconds: 0.0
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  default_start_date: "20100101"
  calendar_exchange: SSE
  index_codes:
    - 000001.SH
    - 000300.SH
    - 399001.SZ
    - 399006.SZ
  index_first_available_dates:
    399006.SZ: "20100531"
  fund_markets:
    - E
  hs_types:
    - SH
    - SZ
  stock_list_statuses:
    - L
    - D
    - P
  date_range_chunk_years: 1
  tushare_page_size: 6000
  finance_revision_lookback_days: 550
  snapshot_refresh_policy: manual
  snapshot_refresh_ttl_days: 7
universe:
  min_list_trading_days: 180
  liquidity_window_days: 20
  min_avg_amount: 30000.0
  require_full_liquidity_window: true
  min_price: null
  exclude_st: true
  mark_limit_up_not_buyable: true
  mark_limit_down_not_sellable: true
  price_tolerance: 0.000001
labels:
  horizons:
    - 5
    - 10
    - 20
    - 60
  benchmark_index_code: 000300.SH
  quantile_buckets: 5
  skip_unbuyable_entry: true
  allow_limit_up_entry: false
  allow_limit_down_exit: false
  delay_unsellable_exit: false
  max_exit_delay_days: 5
  price_adjustment: open_times_adj_factor
features:
  return_windows:
    - 1
    - 3
    - 5
    - 10
    - 20
    - 60
    - 120
  short_windows:
    - 1
    - 2
    - 3
    - 5
  medium_windows:
    - 5
    - 10
    - 20
    - 60
  long_windows:
    - 20
    - 60
    - 120
  quantile_buckets: 5
  min_period_fraction: 0.6
  benchmark_index_code: 000300.SH
  include_fundamentals: true
  enable_industry_features: false
  enable_unsafe_fina_indicator_features: false
diagnostics:
  label_horizon: 5
  minimum_coverage: 0.4
  minimum_daily_cross_section: 20
  minimum_ic_days: 60
  correlation_threshold: 0.85
  regime_return_threshold: 0.005
  model_sample_rows: 500000
  correlation_sample_rows: 200000
  candidate_feature_counts:
    - 30
    - 50
    - 70
    - 100
    - 130
  top_fraction: 0.1
  annualization_days: 252
  random_seed: 42
  lgbm_num_boost_round: 150
  lgbm_learning_rate: 0.05
  lgbm_num_leaves: 31
  lgbm_min_data_in_leaf: 100
  lgbm_feature_fraction: 0.8
  lgbm_bagging_fraction: 0.8
  lgbm_bagging_freq: 1
  permutation_repeats: 1
  model_drift:
    label_horizon: 5
    psi_bins: 10
    score_reference_months: 12
    reference_sample_rows: 200000
    evaluation_sample_rows_per_month: 50000
    minimum_daily_cross_section: 20
    response_bucket_counts:
      - 5
      - 10
    psi_warning_threshold: 0.10
    psi_severe_threshold: 0.25
ranker:
  label_horizon: 5
  relevance_grades: 5
  train_start: "20100101"
  train_end: "20191231"
  validation_start: "20200101"
  validation_end: "20221231"
  test_start: "20230101"
  test_end: "20260710"
  recommended_features_path: reports/feature_diagnostics/latest.json
  robust_features_path: config/feature_sets/robust_features.json
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 200
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  reg_alpha: 0.0
  reg_lambda: 1.0
  random_seed: 42
  minimum_group_size: 20
  ndcg_at:
    - 10
    - 50
  portfolio_fractions:
    - 0.05
    - 0.10
  walk_forward:
    annual_sessions: 252
    minimum_training_years: 5
    rolling_window_years: 5
    validation_sessions: 252
    purge_days: 6
    embargo_days: 6
    evaluation_frequency: monthly
models:
  horizon_experiments:
    - name: h5
      horizon: 5
      holding_days: 5
      execution_rule: next_open
    - name: h10
      horizon: 10
      holding_days: 10
      execution_rule: next_open
    - name: h20
      horizon: 20
      holding_days: 20
      execution_rule: next_open
    - name: h60
      horizon: 60
      holding_days: 60
      execution_rule: next_open
  selection_period:
    start_date: "20150101"
    end_date: "20221231"
  final_test_period:
    start_date: "20230101"
    end_date: "20260710"
  challenger_evaluation:
    score_layers:
      - 0.01
      - 0.05
      - 0.10
      - 0.20
      - 0.50
    minimum_cross_section: 20
    minimum_labelled_days: 60
    regime_return_threshold: 0.005
    minimum_rank_ic: 0.0
    minimum_rank_ic_delta: 0.0
    minimum_positive_ic_ratio: 0.50
    minimum_top10_return_delta: 0.0
production_model:
  train_start: "20100101"
  train_end: "20260710"
  feature_list_path: config/feature_sets/robust_features.json
  output_dir_name: production
production:
  timezone: Asia/Shanghai
  market_data_ready_time: "18:30"
  scheduler:
    enabled: true
    skip_if_already_successful: true
    # Tushare requests already retry internally; keep pipeline-level retries disabled by default.
    max_pipeline_attempts: 1
    retry_backoff_seconds: 30.0
  freshness:
    hard_datasets:
      - daily
      - adj_factor
      - daily_basic
      - stk_limit
      - index_daily
    legitimate_empty_datasets:
      - suspend_d
    soft_dataset_max_lag_calendar_days:
      income: 550
      balancesheet: 550
      cashflow: 550
      fina_indicator: 550
    event_datasets:
      - namechange
    snapshot_max_age_days:
      stock_basic: 14
    required_index_codes: []
    baseline_sessions: 20
    minimum_baseline_sessions: 5
    moderate_count_ratio_low: 0.80
    moderate_count_ratio_high: 1.20
    severe_count_ratio_low: 0.65
    severe_count_ratio_high: 1.35
    minimum_daily_rows: 1000
    minimum_universe_rows: 1000
    minimum_base_universe_rows: 500
    minimum_model_universe_rows: 100
    required_feature_list_path: null
    hard_required_features: []
    warning_features:
      - ret_1d
      - market_excess_ret_5d
      - turnover_rate
    structurally_sparse_features:
      - current_ratio
      - debt_to_assets
      - ocf_to_profit
      - dv_ttm
    hard_feature_missing_ratio: 0.20
    warning_feature_missing_ratio: 0.50
    git_dirty_policy: warning
strategy:
  candidate_selection:
    max_candidates: 50
    require_model_universe: true
    exclude_st: true
    exclude_suspended: true
    exclude_low_liquidity: true
    exclude_bj_market: true
    exclude_star_market: false
    exclude_chinext_market: false
    min_list_trading_days: 180
    require_daily_row: true
    require_daily_basic_row: true
    require_stk_limit_row: true
    min_total_mv: 500000.0
    min_daily_amount: 30000.0
    min_turnover_rate: null
    max_turnover_rate: null
    require_valid_ohlc: true
    require_valid_price_limits: true
    price_limit_tolerance: 0.000001
research:
  daily_report:
    top_candidates: 50
    abnormal_return_abs_pct: 9.0
    volatility_window: 20
    volatility_min_observations: 10
    high_volatility_pct: 4.0
    low_liquidity_amount: 50000.0
  explainability:
    top_positive_features: 5
    top_negative_features: 3
    strong_percentile: 0.99
    moderate_percentile: 0.95
    minimum_history_sessions: 20
    high_confidence_history_sessions: 60
    maximum_history_sessions: 252
    score_tolerance: 0.0000001
    contribution_tolerance: 0.000001
  decision_support:
    gap_feature: gap_mean_1d
    ma20_feature: ma_ratio_20d
    amount_ratio_feature: amount_ratio_20d
    liquidity_feature: amihud_20d
    short_return_feature: ret_5d
    volatility_feature: realized_vol_20d
    maximum_abs_open_gap: 0.03
    minimum_ma20_ratio: 0.0
    minimum_amount_ratio: 0.8
    minimum_turnover_rate: 0.5
    maximum_amihud: 0.00001
    excessive_short_return: 0.15
    elevated_volatility: 0.04
    liquidity_decline_amount_ratio: 0.6
    score_tolerance: 0.0000001
backtest:
  execution: next_open
  initial_cash: 1000000.0
  top_n:
    - 10
    - 20
    - 50
  holding_period_days: 5
  commission: 0.00025
  stamp_duty: 0.001
  slippage: 0.0005
  benchmark_index_code: 000300.SH
  annualization_days: 252
  sell_delay_max_days: 20
  historical:
    top_n:
      - 10
      - 20
      - 50
    holding_period_days: 5
    require_out_of_sample: true
    bull_annual_return_threshold: 0.10
    bear_annual_return_threshold: -0.10
    periods:
      2015-2020:
        start_date: "20150101"
        end_date: "20191231"
      2020-2023:
        start_date: "20200101"
        end_date: "20221231"
      2023-2026:
        start_date: "20230101"
        end_date: "20261231"
  diagnostics:
    horizon: 5
    score_layers:
      - 0.01
      - 0.05
      - 0.10
      - 0.20
    bottom_fraction: 0.20
    minimum_cross_section: 20
    factor_quantiles: 5
    shap_sample_rows: 10000
    prediction_tolerance: 0.0000001
paper_trading:
  enabled: true
  initial_cash: 1000000.0
  execution: next_open
  lot_size: 100
  commission: 0.00025
  stamp_duty: 0.001
  slippage: 0.0005
  price_tolerance: 0.000001
  portfolios:
    - portfolio_id: champion_top20
      signal_type: champion
      model_id: champion
      top_n: 20
    - portfolio_id: h5_top20
      signal_type: model
      model_id: experiment_c_h5_22dcd006e5ef9e96
      top_n: 20
    - portfolio_id: h10_top20
      signal_type: model
      model_id: experiment_c_h10_fabee8b642c17e55
      top_n: 20
    - portfolio_id: ensemble_top20
      signal_type: ensemble
      component_model_ids:
        - experiment_c_h5_22dcd006e5ef9e96
        - experiment_c_h10_fabee8b642c17e55
        - experiment_c_h20_26c38e9bd7b03f65
        - experiment_c_h60_37f19e4e8ffafe59
      top_n: 20
