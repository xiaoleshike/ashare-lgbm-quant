retraining:
  schema_version: 1
  policy_version: v1
  enabled: true
  cooldown_days: 30
  minimum_observation_sessions:
    h5: 60
    h10: 60
    h20: 90
    h60: 120
  lifecycle:
    enabled: true
    max_parallel_runs: 1
    max_daily_training_runs: 1
    cooldown_days: 30
    minimum_prospective_sessions:
      h5: 60
      h10: 60
      h20: 90
      h60: 120
  qualification:
    enabled: true
    phase: "2.8.2G"
    require_clean_worktree: false
    require_dry_run_ready: true
    require_readiness_ready: true
    allow_real_training: false
    require_manual_stage_advance: true
    allow_real_shadow: false
    maximum_qualification_runs_per_day: 1
    allowed_stop_points:
      - preflight
      - dry-run
      - readiness
      - training
      - validation
      - shadow
      - observation
    minimum_free_disk_bytes: null
    minimum_available_memory_bytes: null
    promotion_forbidden: true
    trading_forbidden: true
  triggers:
    alpha_decay:
      enabled: true
      threshold: 0.7
    ic_decline:
      enabled: true
      rolling_window: 60
      threshold: 0.0
    feature_drift:
      enabled: true
      psi_threshold: 0.2
    critical_alert:
      enabled: true
